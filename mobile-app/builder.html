<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>ANKRI CANDLE | Custom Builder</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script type="module" src="/src/app.js"></script>
    <style>
        .progress-dot-active {
            box-shadow: 0 0 0 4px rgba(111, 70, 39, 0.1);
        }

        .candle-preview-glow {
            filter: drop-shadow(0 0 15px rgba(244, 187, 146, 0.3));
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-background text-on-surface font-sans overflow-x-hidden safe-pb" style="padding-bottom:140px;">
    <header
        class="fixed top-0 w-full z-50 bg-surface/80 glass-panel shadow-[0_8px_30px_rgba(0,0,0,0.04)] flex justify-between items-center px-4 safe-pt pb-4 transition-all duration-300">
        <button onclick="window.location.href='/index.html'"
            class="text-primary hover:opacity-70 transition-opacity active:scale-95 duration-200">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 class="text-[24px] tracking-tighter text-primary font-serif">ANKRI CANDLE</h1>
        <button class="text-primary hover:opacity-70 transition-opacity active:scale-95 duration-200">
            <span class="material-symbols-outlined">shopping_bag</span>
        </button>
    </header>
    <main class="pt-[80px] pb-[120px] px-4">
        <nav class="flex flex-col items-center mb-8">
            <div class="flex items-center justify-between w-full max-w-xs relative mb-2">
                <div class="absolute top-1/2 left-0 w-full h-[1px] bg-slate-200 -z-10"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-primary ring-4 ring-primary/10"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-primary ring-4 ring-primary/10"></div>
                <div
                    class="w-6 h-6 rounded-full bg-primary flex items-center justify-center ring-4 ring-primary/10 text-[10px] text-white font-bold">
                    3</div>
                <div class="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-slate-300"></div>
            </div>
            <span class="text-[12px] text-primary uppercase font-bold">Step 3: Fragrance Selection</span>
        </nav>

        <section class="relative mb-10 flex flex-col items-center">
            <div class="w-48 h-56 relative animate-float">
                <img class="w-full h-full object-contain candle-preview-glow"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIJWusxxAwIwYq0Li9vu6STMnxLZbLMOe2SUGXox3D0socyYG9VEdT0vL5kloYYK2CFSb1BDZGe41oKIxVJxfbnvXPIP-XSNE4wvmq8xuKpXxecPU7_HM-dmeitM84jW2IEMfU7WLHOtOduagKKOtivLmvTneKR7a6tpj0PP30rxwAZaNW_cuQ3xnVHtd2LOdYswIf9w-9OCIjvpA20O69yxqjJmLSiJWPCnd3AOMKOAk5vt5PnBRNsg" />
            </div>
            <div class="text-center mt-4">
                <h2 class="text-2xl text-primary font-serif">Your Signature Vessel</h2>
                <p class="text-sm text-slate-500 italic">Matte Sandalwood Edition</p>
            </div>
        </section>

        <section class="mb-6">
            <div class="relative w-full">
                <span
                    class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                <input
                    class="w-full bg-white border border-slate-200 rounded-xl py-4 pl-12 pr-4 text-base focus:ring-1 focus:ring-primary shadow-sm"
                    placeholder="Search scents..." type="text" />
            </div>
            <div class="flex gap-2 mt-4 overflow-x-auto no-scrollbar pb-2">
                <span
                    class="px-4 py-1.5 rounded-full bg-primary text-white text-[11px] font-semibold tracking-wider whitespace-nowrap">ALL
                    SCENTS</span>
                <span
                    class="px-4 py-1.5 rounded-full bg-secondary/10 text-secondary text-[11px] font-semibold tracking-wider whitespace-nowrap">WOODY</span>
                <span
                    class="px-4 py-1.5 rounded-full bg-secondary/10 text-secondary text-[11px] font-semibold tracking-wider whitespace-nowrap">FLORAL</span>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-4">
            <div
                class="bg-amber-50 border-2 border-primary p-4 rounded-xl shadow-sm transition-all flex flex-col items-center text-center">
                <div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined text-primary"
                        style="font-variation-settings: 'FILL' 1;">forest</span>
                </div>
                <h3 class="text-[12px] font-bold text-primary mb-1">SANDALWOOD</h3>
                <p class="text-[10px] leading-tight text-slate-500 font-medium">Warm, creamy, and grounding wood notes.
                </p>
                <div class="mt-3 w-5 h-5 rounded-full bg-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-white text-[14px]">check</span>
                </div>
            </div>
            <div
                class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm hover:border-primary/50 transition-all flex flex-col items-center text-center cursor-pointer">
                <div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-3">
                    <span class="material-symbols-outlined text-slate-500">spa</span>
                </div>
                <h3 class="text-[12px] font-bold text-slate-700 mb-1">LAVENDER</h3>
                <p class="text-[10px] leading-tight text-slate-500">Soothing floral mist with herbal undertones.</p>
                <div class="mt-3 w-5 h-5 rounded-full border border-slate-200"></div>
            </div>
        </section>
    </main>
    <footer
        class="fixed bottom-0 left-0 w-full z-10 glass-panel shadow-[0_-8px_30px_rgba(0,0,0,0.05)] border-t border-outline-variant/20 dark:border-white/10 px-6 pt-4 pb-4 safe-pb flex items-center justify-between rounded-t-2xl">
        <div class="flex flex-col">
            <span class="text-[10px] uppercase font-bold text-slate-500">Estimated Total</span>
            <span class="text-2xl font-serif text-primary dark:text-yellow-500">$42.00</span>
        </div>
        <button onclick="window.location.href='/shop.html'"
            class="bg-primary text-white font-bold text-[12px] px-10 py-4 rounded-full shadow-lg active:scale-95 transition-transform flex items-center gap-2">
            NEXT STEP
        </button>
    </footer>
    <script>
        const cards = document.querySelectorAll('.grid > div');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                cards.forEach(c => {
                    c.classList.remove('border-primary', 'bg-amber-50', 'border-2');
                    c.classList.add('border-slate-200', 'bg-white', 'border');
                    const dot = c.querySelector('.rounded-full:last-child');
                    dot.innerHTML = '';
                    dot.classList.add('border', 'border-slate-200');
                    dot.classList.remove('bg-primary');
                });

                card.classList.remove('border-slate-200', 'bg-white', 'border');
                card.classList.add('border-primary', 'bg-amber-50', 'border-2');
                const activeDot = card.querySelector('.rounded-full:last-child');
                activeDot.innerHTML = '<span class="material-symbols-outlined text-white text-[14px]">check</span>';
                activeDot.classList.remove('border', 'border-slate-200');
                activeDot.classList.add('bg-primary');
            });
        });
        const filterBtns = document.querySelectorAll('.overflow-x-auto span');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active state from all
                filterBtns.forEach(b => {
                    b.classList.remove('bg-primary', 'text-white');
                    b.classList.add('bg-secondary/10', 'text-secondary');
                });
                // Add active state to clicked
                btn.classList.remove('bg-secondary/10', 'text-secondary');
                btn.classList.add('bg-primary', 'text-white');
            });
        });
    </script>
</body>

</html>
