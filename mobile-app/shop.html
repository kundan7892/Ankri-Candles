    <script>
        const filterChips = document.querySelectorAll('.flex.gap-3.overflow-x-auto button');
        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => {
                    c.classList.remove('bg-secondary/10', 'text-secondary', 'border-secondary/20');
                    c.classList.add('bg-surface', 'border-outline-variant', 'text-on-surface-variant');
                });
                chip.classList.remove('bg-surface', 'border-outline-variant', 'text-on-surface-variant');
                chip.classList.add('bg-secondary/10', 'text-secondary', 'border-secondary/20');
            });
        });

        const addButtons = document.querySelectorAll('.absolute.bottom-3.right-3');
        addButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const icon = btn.querySelector('.material-symbols-outlined');
                icon.textContent = 'check';
                btn.classList.add('bg-secondary', 'text-on-secondary');
                btn.classList.remove('text-primary');

                setTimeout(() => {
                    icon.textContent = 'add';
                    btn.classList.remove('bg-secondary', 'text-on-secondary');
                    btn.classList.add('bg-surface/90', 'text-primary');
                }, 2000);
            });
        });
    </script>
